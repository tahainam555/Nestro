[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nestro-backend"
version = "0.1.0"
description = "FastAPI backend service for Nestro"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "sqlalchemy[asyncio]>=2.0.32,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "redis>=5.0.7,<6.0.0",
    "pinecone-client>=5.0.0,<6.0.0",
    "openai>=1.51.0,<2.0.0",
    "instructor>=1.6.3,<2.0.0",
    "boto3>=1.35.0,<2.0.0",
    "langchain-core>=0.3.0,<1.0.0",
    "langchain>=0.3.0,<1.0.0",
    "langchain-openai>=0.2.0,<1.0.0",
    "bcrypt>=4.2.0,<5.0.0",
    "PyJWT>=2.9.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.5.0,<1.0.0",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "core*", "db*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
